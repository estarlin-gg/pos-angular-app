@if (table(); as t) {
  <div [class]="cardClass()" (click)="selected.emit(t)">
    <div class="card-body d-flex flex-column">
      <div class="d-flex justify-content-between align-items-center gap-2">
        <span class="small text-uppercase fw-semibold">{{ statusLabel() }}</span>
        <span class="small fw-semibold d-inline-flex align-items-center gap-1">
          <svg lucideUsers [size]="14"></svg>
          {{ t.guestCount }}
        </span>
      </div>

      <div class="d-flex align-items-center flex-grow-1 pt-3">
        <div class="w-50 border-bottom border-2 border-light pb-2">
          <span class="fs-1 fw-bold lh-1">{{ t.number }}</span>
        </div>
      </div>
    </div>
  </div>
}
